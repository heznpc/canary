name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow-level least privilege; jobs can narrow further if they ever need
# write access. Pinned action SHAs below are kept current by Dependabot
# (.github/dependabot.yml → github-actions ecosystem, monthly).
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6 latest

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6 latest
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: MCP bundle smoke test
        run: npm run mcp:smoke
