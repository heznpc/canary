name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow-level least privilege; jobs can narrow further if they ever need
# write access. Pinned action SHAs below are kept current by Dependabot
# (.github/dependabot.yml → github-actions ecosystem, monthly).
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6 latest

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6 latest
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: MCP bundle smoke test
        run: npm run mcp:smoke
