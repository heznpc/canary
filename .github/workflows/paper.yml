name: Paper

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - 'submissions/**'
      - '.github/workflows/paper.yml'
  pull_request:
    branches: [main]
    paths:
      - 'paper/**'
      - 'submissions/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build canonical paper + validate citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 latest

      - name: Compile LaTeX (multi-pass with bibtex)
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3 latest
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -interaction=nonstopmode

      - name: Fail on undefined citations or references
        run: |
          set -eo pipefail
          log=paper/main.log
          if [ ! -f "$log" ]; then
            echo "::error::paper/main.log not found — LaTeX build did not produce one"
            exit 1
          fi
          if grep -E "Citation .* undefined|didn't find a database entry|Reference .* undefined" "$log"; then
            echo "::error::Undefined citations or references in paper/main.log"
            exit 1
          fi
          echo "no undefined citations or references"

      - name: Upload PDF artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 latest
        with:
          name: canary-paper-${{ github.sha }}
          path: paper/main.pdf
          retention-days: 14

  build-submissions:
    name: Build venue submissions + validate citations
    runs-on: ubuntu-latest
    # Skip if there are no submission directories (e.g., before any has been
    # scaffolded). The job uses a glob-based dynamic matrix-substitute by
    # iterating over submissions/*/main.tex.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 latest

      - name: Detect submission directories
        id: list
        run: |
          set -eo pipefail
          shopt -s nullglob
          subs=( submissions/*/main.tex )
          if [ ${#subs[@]} -eq 0 ]; then
            echo "no submissions/*/main.tex found — skipping"
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          # Newline-separated paths to ./submissions/<venue>/main.tex
          {
            echo "list<<EOF"
            for f in "${subs[@]}"; do echo "$f"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile each submission (multi-pass with bibtex)
        if: steps.list.outputs.any == 'true'
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3 latest
        # latex-action's action.sh accepts a single root file, so we iterate
        # via pre_compile to handle all submissions if more than one exists.
        with:
          root_file: ${{ github.workspace }}/submissions/onward-essays-2026/main.tex
          working_directory: submissions/onward-essays-2026
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -interaction=nonstopmode

      - name: Fail on undefined citations or references (submissions)
        if: steps.list.outputs.any == 'true'
        run: |
          set -eo pipefail
          for log in submissions/*/main.log; do
            [ -f "$log" ] || continue
            if grep -E "Citation .* undefined|didn't find a database entry|Reference .* undefined" "$log"; then
              echo "::error::Undefined citations or references in $log"
              exit 1
            fi
          done
          echo "no undefined citations or references in any submission"

      - name: Upload submission PDFs
        if: success() && steps.list.outputs.any == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 latest
        with:
          name: canary-submissions-${{ github.sha }}
          path: submissions/*/main.pdf
          retention-days: 14
