name: Paper

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - 'submissions/**'
      - '.github/workflows/paper.yml'
  pull_request:
    branches: [main]
    paths:
      - 'paper/**'
      - 'submissions/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build canonical paper + validate citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6 latest

      - name: Compile LaTeX (multi-pass with bibtex)
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4 latest
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -interaction=nonstopmode

      - name: Fail on undefined citations or references
        run: |
          set -eo pipefail
          log=paper/main.log
          if [ ! -f "$log" ]; then
            echo "::error::paper/main.log not found — LaTeX build did not produce one"
            exit 1
          fi
          if grep -E "Citation .* undefined|didn't find a database entry|Reference .* undefined" "$log"; then
            echo "::error::Undefined citations or references in paper/main.log"
            exit 1
          fi
          echo "no undefined citations or references"

      - name: Upload PDF artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 latest
        with:
          name: canary-paper-${{ github.sha }}
          path: paper/main.pdf
          retention-days: 14

  # Detect which submission directories exist, emit a JSON array consumed by
  # the matrix-driven build-submissions job below. Replaces the prior
  # hardcoded `root_file: submissions/onward-essays-2026/main.tex` which
  # would silently skip a second submission once one is added.
  detect-submissions:
    name: Detect submission directories
    runs-on: ubuntu-latest
    outputs:
      submissions: ${{ steps.list.outputs.submissions }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6 latest
      - id: list
        run: |
          set -eo pipefail
          shopt -s nullglob

          # Reject any submission directory name that contains characters
          # actions/upload-artifact rejects (`" : * ? < > | \` or CR/LF) or
          # that would corrupt the JSON we emit to GITHUB_OUTPUT. Done up
          # front so a typo'd dirname fails loud with a clear message
          # rather than producing malformed JSON / broken artifact names
          # downstream. (2026-05-29 code review, findings 10 + 13.)
          subs=( submissions/*/main.tex )
          if [ ${#subs[@]} -eq 0 ]; then
            echo "no submissions/*/main.tex found — skipping"
            {
              echo "any=false"
              # Use heredoc delimiter even for the empty array so future
              # edits don't accidentally drop the safe-form below.
              echo "submissions<<JSON_EOF"
              echo "[]"
              echo "JSON_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for f in "${subs[@]}"; do
            dir="${f%/main.tex}"
            case "$dir" in
              *[\"\\:*?\<\>\|$'\r'$'\n']*)
                echo "::error::Submission directory name '$dir' contains a character forbidden by actions/upload-artifact or by the JSON output encoding."
                exit 1
                ;;
            esac
          done

          # Build the JSON array via `jq` so escaping is correct by
          # construction (handles unusual but legal characters like `&`
          # or `+`). The validation loop above is the load-bearing safety
          # check; jq is the encoder.
          arr=$(printf '%s\n' "${subs[@]%/main.tex}" | jq -R . | jq -sc .)

          # Multi-line heredoc form for $GITHUB_OUTPUT — protects against
          # any future newline in $arr breaking the KEY=VALUE parser.
          {
            echo "any=true"
            echo "submissions<<JSON_EOF"
            echo "$arr"
            echo "JSON_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Detected submissions: $arr"

  build-submissions:
    name: Build venue submission + validate citations
    needs: detect-submissions
    if: needs.detect-submissions.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        submission: ${{ fromJson(needs.detect-submissions.outputs.submissions) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6 latest

      - name: Compile ${{ matrix.submission }} (multi-pass with bibtex)
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4 latest
        with:
          root_file: main.tex
          working_directory: ${{ matrix.submission }}
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -interaction=nonstopmode

      - name: Fail on undefined citations or references
        run: |
          set -eo pipefail
          log="${{ matrix.submission }}/main.log"
          if [ ! -f "$log" ]; then
            echo "::error::$log not found — LaTeX build did not produce one"
            exit 1
          fi
          if grep -E "Citation .* undefined|didn't find a database entry|Reference .* undefined" "$log"; then
            echo "::error::Undefined citations or references in $log"
            exit 1
          fi
          echo "no undefined citations or references in $log"

      - name: Compute slash-free artifact name
        id: artifact_name
        run: |
          safe="${{ matrix.submission }}"
          # actions/upload-artifact rejects '/' in artifact names.
          safe="${safe//\//-}"
          echo "name=canary-${safe}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Upload PDF
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 latest
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ matrix.submission }}/main.pdf
          retention-days: 14
