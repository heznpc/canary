name: Sync heznpc Landing Page

# ------------------------------------------------------------------------------
# Secret: HEZNPC_PAT
# ------------------------------------------------------------------------------
# This workflow writes to heznpc/heznpc (cross-repository), which GITHUB_TOKEN
# cannot reach. HEZNPC_PAT must be a *fine-grained* PAT (not classic), scoped
# strictly as follows:
#
#   - Resource owner:    heznpc
#   - Repository access: heznpc/heznpc ONLY (single-repo)
#   - Permissions:       Contents: read & write   (no other scopes)
#   - Expiration:        90 days maximum; rotate on or before expiry.
#
# Rotation log (date — actor — note):
#   - 2026-05-21 — heznpc — Policy documented. Verify current PAT meets the
#                            above shape; if it is a classic PAT or has wider
#                            scope, regenerate as fine-grained immediately.
#
# Why fine-grained: classic PATs grant the holder write access to every repo
# the user owns; a leaked classic PAT here would compromise the entire
# heznpc/* surface, not just the landing-page sync target. See SECURITY.md for
# the disclosure path if this secret is suspected of being exposed.
# ------------------------------------------------------------------------------

on:
  repository_dispatch:
    types: [project-updated]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # Weekly Monday fallback

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Canary
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6 latest

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6 latest
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scan and generate projects.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Start Next.js in background, hit the sync API, save output
          npm run build
          npx tsx -e "
            const { scanAll } = require('./lib/scanners');
            const { generateProjectsJson } = require('./lib/sync/heznpc');
            (async () => {
              const data = await scanAll();
              const json = generateProjectsJson(data);
              require('fs').writeFileSync('projects.json', json);
              console.log('Generated projects.json');
            })();
          "

      - name: Checkout heznpc
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6 latest
        with:
          repository: heznpc/heznpc
          path: heznpc-repo
          token: ${{ secrets.HEZNPC_PAT }}

      - name: Update heznpc
        run: |
          cp projects.json heznpc-repo/projects.json
          cd heznpc-repo
          node build.js
          git config user.name "canary-bot"
          git config user.email "canary-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: sync project data from Canary"
          git push

      - name: Check doc freshness and create issues
        env:
          GITHUB_TOKEN: ${{ secrets.HEZNPC_PAT }}
        run: |
          npx tsx -e "
            const { scanAll } = require('./lib/scanners');
            (async () => {
              const data = await scanAll();
              for (const p of data.projects) {
                if (p.docFreshness && p.docFreshness.mismatches.length > 0) {
                  const body = p.docFreshness.mismatches.map(m =>
                    '- **' + m.file + '**: ' + m.field + ' — expected ' + m.expected + ', found ' + m.actual
                  ).join('\n');

                  console.log('Doc drift in ' + p.project.repo + ':\n' + body);
                  // Create issue via GitHub API
                  // gh api repos/{repo}/issues -f title='doc-drift: ...' -f body='...' -f labels='doc-drift'
                }
              }
            })();
          "
